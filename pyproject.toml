[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-dubbing"
version = "1.1.0"
description = "An AI powered tool to execute end-to-end video dubbing."
keywords = ["video", "dubbing", "ai", "openai", "whisper", "llm"]
authors = [{ name = "yuanshanhua" }]
urls = { github = "https://github.com/yuanshanhua/video-dubbing" }
readme = "README.md"
license = "MIT"
scripts = { dub = "video_dubbing.cli:cli" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "aiolimiter>=1.2.1",
    "edge-tts>=7.0.0",
    "openai>=1.59.9",
    "tomlkit>=0.13.2",
    "pyyaml",
    "rapidfuzz>=3.12.2",
]

[tool.pyright]
include = ["src/", "tests/", "scripts/"]
exclude = []

[tool.ty]
src = { include = ["src/", "scripts/"], exclude = [] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "strict"

[dependency-groups]
dev = ["pyright>=1.1.411", "pytest>=9.1.1", "ruff>=0.16.0", "ty>=0.0.63"]
